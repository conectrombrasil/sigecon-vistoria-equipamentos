/* =====================================================================
   FORNECEDOR — pendências de envio (edição, documentos, categorias)
   Mesmo esquema do app de imóveis: tudo fica no celular e sobe em ordem.
   ===================================================================== */
const Forn = {
  pend: [],
  async iniciar(){ this.pend = await BD.pegar('meta', 'forn_pend') || []; },
  async _gravar(){ await BD.gravar('meta', this.pend, 'forn_pend'); },
  async add(p){ this.pend.push({ id: uuid(), em: new Date().toISOString(), ...p }); await this._gravar(); },
  qtd(){ return Repo.fornsNovos.filter(f=>!f.enviado).length + this.pend.length; },
  // só quem cadastrou pode editar (igual imóveis)
  podeEditar(f){ return !!f && (f._novo ? (!f.criado_por || f.criado_por===sessao?.id) : f.criado_por===sessao?.id); },
  // categorias aplicadas sozinhas: Documentos Gerais PF/PJ + a de equipamentos
  categorias(tipoPessoa){
    const cats = Repo.cat?.categorias || [], tipos = Repo.cat?.doc_tipos || [];
    const pf = tipoPessoa==='PF', geral = pf ? '__GERAL_PF__' : '__GERAL_PJ__';
    const ehEquip = c=>/equipamento|maquina/.test(_semAc(c.nome));
    return cats.filter(c=>c.nome===geral || ehEquip(c))
      .map(c=>({ ...c, rotulo: c.nome==='__GERAL_PJ__' ? 'Documentos Gerais PJ' : c.nome==='__GERAL_PF__' ? 'Documentos Gerais PF' : c.nome,
        tipos: tipos.filter(t=>t.categoria_id===c.id && (pf ? t.aplica_pf : t.aplica_pj)) }));
  },
  async trocarId(de, para){
    let mudou = false;
    this.pend = this.pend.filter(p=>!(p.fornecedor_id===de && p.tipo==='atualizar')); // não sobrescreve o cadastro de outra pessoa
    this.pend.forEach(p=>{ if (p.fornecedor_id===de) { p.fornecedor_id = para; mudou = true; } });
    await this._gravar();
  },
  async sincronizar(){
    let erro = null;
    for (const f of Repo.fornsNovos.filter(x=>!x.enviado)) { const e = await enviarFornNovo(f.id); if (e) erro = e; }
    for (const p of [...this.pend]) {
      if (Repo.fornPendente(p.fornecedor_id)) continue; // o fornecedor ainda não subiu
      try {
        if (p.tipo==='atualizar') {
          const { error } = await sb.from('fornecedores').update(p.campos).eq('id', p.fornecedor_id); if (error) throw error;
        } else if (p.tipo==='vinculo') {
          const { error } = await sb.from('fornecedor_categorias_vinculo').insert({ fornecedor_id:p.fornecedor_id, categoria_id:p.categoria_id, criado_por:sessao.id });
          if (error && error.code!=='23505') throw error;
        } else if (p.tipo==='doc') {
          const d = await BD.pegar('fotos', p.arquivo_id);
          if (d) {
            const arq = await sgEnviarArquivo(d.blob, { modulo:'fornecedores', registroId:p.fornecedor_id, nomeArquivo:d.nome, mimeType:d.mime });
            const { error } = await sb.from('documentos').insert({ modulo:'fornecedores', registro_id:p.fornecedor_id, tipo:'exigido', documento_tipo_id:p.documento_tipo_id,
              nome_arquivo:d.nome, mime_type:d.mime, tamanho_bytes:d.bytes, drive_id:null, drive_url:arq.drive_url, download_url:arq.download_url, versao:1, status:'enviado', criado_por:sessao.id });
            if (error) { await sgRemoverArquivo(arq); throw error; }
            await BD.apagar('fotos', p.arquivo_id).catch(()=>{});
          }
        }
        this.pend = this.pend.filter(x=>x.id!==p.id); await this._gravar();
      } catch (e) { erro = (p.tipo==='doc' ? 'Documento do fornecedor: ' : 'Fornecedor: ') + traduzErro(e); }
    }
    return erro;
  },
};

const Sinc = {
  rodando: false,
  async empurrar(){
    let ok = 0, ultimoErro = null;
    for (const v of Repo.aEnviar()) {
      try {
        if (v.equip_novo) await cadastrarEquipNoSistema(v);
        // fotos
        const itens = [];
        for (const i of ITENS) {
          const r = v.resp[i.c]; if (!r || !r.sit) continue;
          const caminhos = [];
          for (const fid of (r.fotos||[])) {
            const f = await BD.pegar('fotos', fid); if (!f) continue;
            if (!f.caminho) { const c = `${v.id}/${i.c.replace('.','-')}-${fid.slice(0,8)}.jpg`; await subirArquivo(c, f.blob, 'image/jpeg'); f.caminho = c; await BD.gravar('fotos', f); }
            caminhos.push(f.caminho);
          }
          itens.push({ codigo:i.c, secao:i.secao, secao_titulo:i.secao_titulo, titulo:i.t, tipo:i.tipo, situacao:r.sit, obs:r.obs||'', valor:r.valor ?? null, unidade:i.un||null, texto:r.texto||'', fotos:caminhos });
        }
        // assinaturas
        if (v.assin_vist?.img && !v.assin_vist.caminho) { const c = `${v.id}/assinatura-vistoriador.png`; await subirArquivo(c, await dataUrlParaBlob(v.assin_vist.img), 'image/png'); v.assin_vist.caminho = c; }
        if (v.rep?.assin?.img && !v.rep.assin.caminho) { const c = `${v.id}/assinatura-representante.png`; await subirArquivo(c, await dataUrlParaBlob(v.rep.assin.img), 'image/png'); v.rep.assin.caminho = c; }
        if (v.assin_vist?.selfie && !v.assin_vist.selfie_caminho) { const c = `${v.id}/selfie-vistoriador.jpg`; await subirArquivo(c, await dataUrlParaBlob(v.assin_vist.selfie), 'image/jpeg'); v.assin_vist.selfie_caminho = c; }
        if (v.rep?.foto && !v.rep.foto_caminho) { const c = `${v.id}/foto-representante.jpg`; await subirArquivo(c, await dataUrlParaBlob(v.rep.foto), 'image/jpeg'); v.rep.foto_caminho = c; }
        v._itensServidor = itens;
        const linha = linhaServidor(v);
        delete v._itensServidor;
        let { error } = await sb.from('frota_vistorias').upsert(linha);
        // colunas novas (selfie/foto) ainda não criadas no banco: envia sem elas
        if (error && /vistoriador_selfie|vistoriador_metodo|vistoriador_gps|representante_foto/.test(error.message||'')) {
          ['vistoriador_selfie','vistoriador_metodo','vistoriador_gps','representante_foto','representante_foto_recusou'].forEach(k=>delete linha[k]);
          ({ error } = await sb.from('frota_vistorias').upsert(linha));
        }
        if (error) throw error;
        v.erro_envio = null; v.no_servidor = true; v.enviado_em = new Date().toISOString();
        await Repo.salvar(v, false); ok++;
      } catch (e) {
        delete v._itensServidor;
        ultimoErro = e; v.erro_envio = traduzErro(e); await Repo.salvar(v, true);
      }
    }
    return { ok, ultimoErro };
  },
  async rodar(silencioso){
    if (this.rodando || !online() || !sessao) return;
    this.rodando = true; renderStatus();
    try {
      const { data } = await sb.auth.getSession();
      if (!data.session) { if (!silencioso) toast('Sua sessão expirou. Saia e entre de novo pra enviar.', 'erro'); return; }
      await MinhaAssinatura.enviar().catch(()=>{});
      const ef = await Forn.sincronizar().catch(e=>traduzErro(e));
      if (ef && !silencioso) toast('Não deu pra enviar: '+ef, 'erro');
      const r = await this.empurrar();
      await Repo.atualizarServidor().catch(()=>{});
      if (r.ok && !silencioso) toast(r.ok>1 ? r.ok+' vistorias enviadas' : 'Vistoria enviada', 'sucesso');
      else if (r.ok) toast(r.ok>1 ? r.ok+' vistorias enviadas ao sistema' : 'Vistoria enviada ao sistema', 'sucesso');
      if (r.ultimoErro && !silencioso) toast('Não deu pra enviar: '+traduzErro(r.ultimoErro), 'erro');
    } catch (e) { if (!silencioso) toast('Não deu pra sincronizar agora. O app tenta de novo quando o sinal melhorar.', 'erro'); }
    finally {
      this.rodando = false;
      if (telaAtiva()==='tela-home') renderHome();
      renderStatus();
    }
  },
};
window.addEventListener('online', ()=>{ renderStatus(); Sinc.rodar(true); });
window.addEventListener('offline', renderStatus);
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && sessao && Repo.cat) Sinc.rodar(true); });
setInterval(()=>{ if (sessao && (Repo.aEnviar().length || Forn.qtd())) Sinc.rodar(true); }, 120000);

function renderStatus(){
  const el = document.getElementById('status-barra'); if (!el) return;
  const pend = Repo.aEnviar().length, pf = Forn.qtd();
  if (!pend && pf) {
    if (!online()) { el.className = 'status-barra offline'; el.innerHTML = `Sem internet · ${pf} envio${pf>1?'s':''} de fornecedor esperando`; return; }
    if (Sinc.rodando) { el.className = 'status-barra pendente'; el.innerHTML = '<span class="spinner"></span> Enviando…'; return; }
    el.className = 'status-barra pendente'; el.innerHTML = `${pf} envio${pf>1?'s':''} de fornecedor esperando <button onclick="Sinc.rodar()"><svg class="ic" style="width:16px;height:16px"><use href="#i-envio"/></svg>Enviar agora</button>`; return;
  }
  if (!online()) { el.className = 'status-barra offline'; el.innerHTML = `Sem internet${pend?` · ${pend} vistoria${pend>1?'s':''} esperando pra subir`:' · pode vistoriar normalmente'}`; return; }
  if (Sinc.rodando) { el.className = 'status-barra pendente'; el.innerHTML = '<span class="spinner"></span> Enviando…'; return; }
  if (pend) { el.className = 'status-barra pendente'; el.innerHTML = `${pend} vistoria${pend>1?'s':''} esperando pra subir <button onclick="Sinc.rodar()"><svg class="ic" style="width:16px;height:16px"><use href="#i-envio"/></svg>Enviar agora</button>`; return; }
  el.className = 'status-barra'; el.innerHTML = '';
}

let filtroHome = 'todas';
function situacaoSinc(v){
  if (v._servidor) return { k:'enviado', l:'No sistema', c:'selo-enviado' };
  if (v.status!=='concluida') return { k:'rascunho', l:'Em andamento', c:'selo-rascunho' };
  if (v._pendente && v.erro_envio) return { k:'erro', l:'Não subiu', c:'selo-erro' };
  if (v._pendente) return { k:'pendente', l:'Esperando envio', c:'selo-info' };
  return { k:'enviado', l:'No sistema', c:'selo-enviado' };
}
function listaHome(){
  const locais = Repo.vistorias();
  const srv = Repo.servidor.filter(s=>!locais.some(l=>l.id===s.id)).map(s=>({ id:s.id, tipo:s.tipo, status:'concluida', _servidor:true, equipamento:s.equipamento||{}, equipamento_id:s.equipamento_id,
    obra_nome:s.obra_nome, data_vistoria:s.data_vistoria, vistoriador_nome:s.vistoriador_nome, resumo:s.resumo||{} }));
  return [...locais, ...srv].sort((a,b)=>String(b.data_vistoria||b.criado_em).localeCompare(String(a.data_vistoria||a.criado_em)));
}
function renderHome(){
  const p = Repo.vistorias().filter(v=>v.status!=='concluida').length;
  document.getElementById('home-sub').textContent = `${sessao?.nome||''}${p?` · ${p} em andamento`:''}`;
  document.getElementById('home-abas').innerHTML = `<button class="${homeAba==='vist'?'sel':''}" onclick="mudarAbaHome('vist')">📋 Vistorias</button><button class="${homeAba==='equip'?'sel':''}" onclick="mudarAbaHome('equip')">🚜 Equipamentos</button>`;
  if (homeAba==='equip') return renderEquipHome();
  const todas = listaHome();
  const filtros = [
    ['todas','Todas', todas.length], ['andamento','Em andamento', todas.filter(v=>v.status!=='concluida').length],
    ['enviar','A enviar', todas.filter(v=>v.status==='concluida' && v._pendente).length],
    ['mobilizacao','Mobilização', todas.filter(v=>v.tipo==='mobilizacao').length], ['desmobilizacao','Desmobilização', todas.filter(v=>v.tipo==='desmobilizacao').length],
  ];
  document.getElementById('filtros-home').innerHTML = filtros.map(([k,l,n])=>`<button class="chip-filtro ${filtroHome===k?'ativo':''}" onclick="filtroHome='${k}';renderHome()">${l}<span class="chip-n">${n}</span></button>`).join('');
  const q = (document.getElementById('busca-home').value||'').toLowerCase().trim();
  let lista = todas.filter(v=>{
    if (filtroHome==='andamento' && v.status==='concluida') return false;
    if (filtroHome==='enviar' && !(v.status==='concluida' && v._pendente)) return false;
    if (['mobilizacao','desmobilizacao'].includes(filtroHome) && v.tipo!==filtroHome) return false;
    if (!q) return true;
    const e = v.equipamento||{};
    return [e.descricao, e.placa, e.prefixo, e.fornecedor_nome, v.obra_nome, v.vistoriador_nome].some(x=>String(x||'').toLowerCase().includes(q));
  });
  const el = document.getElementById('lista-home');
  let html = '';
  if (promptInstalar) html += `<button class="faltam" onclick="instalarApp()"><span class="faltam-num">📲</span><span class="faltam-txt">Instalar o app no celular<small>Fica com ícone na tela e abre sem internet.</small></span></button>`;
  if (swEsperando) html += `<button class="faltam" onclick="atualizarApp()"><span class="faltam-num">⬆️</span><span class="faltam-txt">Nova versão do app<small>Toque pra atualizar.</small></span></button>`;
  if (!lista.length) html += `<div class="vazio"><div class="vazio-icone">📋</div>${todas.length ? 'Nenhuma vistoria com esse filtro.' : 'Nenhuma vistoria ainda.<br/>Toque em <b>Nova vistoria</b> pra começar.'}</div>`;
  html += lista.map(v=>{
    const e = v.equipamento||{}, s = situacaoSinc(v), r = v.resumo || (v.resp ? resumoVist(v) : {});
    const prog = v.status!=='concluida' && v.resp ? progresso(v) : null;
    return `<button class="card card-vist sy-${s.k}" onclick="abrirVistoria('${v.id}')">
      <div class="card-topo-linha"><span class="selo ${v.tipo==='desmobilizacao'?'selo-desmob':'selo-mob'}">${v.tipo==='desmobilizacao'?'Desmobilização':'Mobilização'}</span><span class="selo ${s.c}">${s.l}</span>${r.avarias?`<span class="selo selo-rascunho">⚠️ ${r.avarias} avaria${r.avarias>1?'s':''}</span>`:''}</div>
      <div class="card-linha"><div class="foto-mini">${iconeEquip(e)}</div>
        <div style="flex:1;min-width:0"><div class="card-titulo">${esc(e.descricao||'Equipamento não escolhido')}</div>
          <div class="card-sub">${esc([idEquip(e), e.fornecedor_nome].filter(Boolean).join(' · ')||'—')}</div></div>
        <span class="card-seta"><svg class="ic"><use href="#i-seta"/></svg></span></div>
      <div class="card-rodape"><span>📅 <b>${fmtDataHora(v.data_vistoria||v.criado_em)}</b></span>${v.obra_nome?`<span>🏗️ ${esc(v.obra_nome)}</span>`:''}${prog?`<span style="margin-left:auto"><b>${prog.feitos}/${prog.total}</b> itens</span>`:''}</div>
      ${v.erro_envio && v._pendente ? `<div class="card-msg" style="color:var(--err-txt)">${esc(v.erro_envio)}</div>` : ''}
    </button>`;
  }).join('');
  el.innerHTML = html;
  renderStatus();
}

let homeAba = 'vist', filtroEquip = null;
function mudarAbaHome(a){
  homeAba = a; const b = document.getElementById('busca-home'); if (b) { b.value = ''; b.placeholder = a==='equip' ? 'Buscar prefixo, placa, chassi, fornecedor' : 'Buscar equipamento, placa, obra'; }
  renderHome();

function minhasObras(){ return Array.isArray(sessao?.obras) ? sessao.obras : []; }
// obra onde o equipamento está: contrato ativo; senão, a última vistoria (mobilização = na obra; desmobilização = saiu)
function obraDoEquip(id){
  const c = Repo.cat?.mob?.[id]; if (c) return c;
  const ult = listaHome().filter(v=>v.equipamento_id===id && v.status==='concluida')
    .sort((a,b)=>String(b.data_vistoria||b.criado_em).localeCompare(String(a.data_vistoria||a.criado_em)))[0];
  if (!ult || ult.tipo!=='mobilizacao') return null;
  return ult.obra_id || (Repo.servidor.find(s=>s.id===ult.id)?.obra_id) || null;
}
function nomeObra(id){ return Repo.obra(id)?.nome || ''; }
function fornNomeEquip(e){ return e?.fornecedores?.razao_social || e?.fornecedor_nome || Repo.fornecedor(e?.fornecedor_id)?.razao_social || ''; }
function equipLocalPendente(e){ return !!(e && e._novo && !e.cadastrado); }
function podeEditarEquip(e){
  if (!e) return false;
  if (equipLocalPendente(e)) return true; // ainda só no celular
  const p = sessao?.perfilApp;
  if (p==='admin') return true;
  if (p!=='gestor') return false;
  const o = obraDoEquip(e.id);
  return !!o && minhasObras().includes(o);
}
function renderEquipHome(){
  const todos = Repo.equipamentos();
  const minhas = minhasObras();
  if (!filtroEquip) filtroEquip = minhas.length && sessao?.perfilApp!=='admin' ? 'minhas' : 'todos';
  const comObra = todos.map(e=>({ e, o: obraDoEquip(e.id) }));
  const nMinhas = comObra.filter(x=>x.o && minhas.includes(x.o)).length, nMob = comObra.filter(x=>x.o).length;
  const filtros = [ ...(minhas.length ? [['minhas','Minhas obras', nMinhas]] : []), ['mob','Mobilizados', nMob], ['todos','Todos', todos.length] ];
  document.getElementById('filtros-home').innerHTML = filtros.map(([k,l,n])=>`<button class="chip-filtro ${filtroEquip===k?'ativo':''}" onclick="filtroEquip='${k}';renderHome()">${l}<span class="chip-n">${n}</span></button>`).join('');
  const q = _semAc(document.getElementById('busca-home').value||'').trim();
  let lista = comObra.filter(({e,o})=>{
    if (filtroEquip==='minhas' && !(o && minhas.includes(o))) return false;

    return [e.descricao, e.prefixo, e.placa, e.numero_serie, e.marca, e.modelo, e.frota_tipos?.nome, fornNomeEquip(e), nomeObra(o)].some(x=>_semAc(x).includes(q));
  }).sort((a,b)=>String(a.e.prefixo||a.e.descricao||'').localeCompare(String(b.e.prefixo||b.e.descricao||''), 'pt-BR', { numeric:true }));
  const total = lista.length; lista = lista.slice(0, 300);

        <span class="card-seta"><svg class="ic"><use href="#i-seta"/></svg></span></div>
      <div class="card-rodape">${o ? `<span>🏗️ ${esc(nomeObra(o)||'Obra')}</span>` : `<span style="color:var(--text3)">Sem obra no momento</span>`}${equipLocalPendente(e)?'<span class="selo selo-rascunho" style="margin-left:auto">cadastrado no app</span>':''}</div>
    </button>`).join('');
  if (total > lista.length) html += `<div class="ajuda" style="text-align:center">Mostrando ${lista.length} de ${total}. Use a busca pra achar os outros.</div>`;
  document.getElementById('lista-home').innerHTML = html;

async function salvarEdicaoEquip(id){

  const g = k=>document.getElementById(k).value.trim(), erro = document.getElementById('ee-erro'), btn = document.getElementById('ee-btn');
  erro.textContent = '';
  if (!podeEditarEquip(e)) { erro.textContent = 'Você não tem permissão pra editar este equipamento.'; return; }
  const placa = g('ee-placa').toUpperCase(), serie = g('ee-serie'), ano = g('ee-ano');
  if (ano && !/^\d{4}$/.test(ano)) { erro.textContent = 'Ano com 4 dígitos (ex.: 2022).'; return; }
  const campos = { prefixo: g('ee-prefixo').toUpperCase() || null, placa: placa || null, numero_serie: serie || null, marca: g('ee-marca') || null, modelo: g('ee-modelo') || null, ano: ano ? parseInt(ano) : null };
  campos.descricao = [e.frota_tipos?.nome, campos.marca, campos.modelo].filter(Boolean).join(' ') + (placa ? ' — '+placa : serie ? ' — '+serie : '');
  if (!campos.descricao.trim()) campos.descricao = e.descricao;
  // placa / chassi não podem repetir (lista do celular + servidor)
  const sp = x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const achar = lista=>lista.find(x=>x.id!==id && ((placa && sp(x.placa)===sp(placa)) || (serie && sp(x.numero_serie)===sp(serie))));
  const msgDup = d=>`Essa ${placa && sp(d.placa)===sp(placa) ? 'placa' : 'nº de série/chassi'} já está em "${d.descricao}" (${d.fornecedores?.razao_social || d.fornecedor_nome || '—'})${d.ativo===false?' — cadastro inativo':''}. Não é possível repetir.`;
  let dup = achar([...(Repo.cat?.equipamentos||[]), ...Repo.equipsNovos]);
  if (dup) { erro.textContent = msgDup(dup); return; }

  if (equipLocalPendente(e)) { // ainda não subiu: corrige no celular e sobe já corrigido
    Object.assign(e, campos); await Repo.salvarEquipNovo(e);
    for (const vv of Repo.vistorias().filter(x=>x.equipamento_id===id && x.status!=='concluida')) { vv.equipamento = snapshotEquip(e); await Repo.salvar(vv); }
    toast('Equipamento atualizado.', 'sucesso'); abrirFichaEquip(id); renderHome(); return;
  }
  if (!online()) { erro.textContent = 'Precisa de internet pra salvar a edição.'; return; }
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    if (placa || serie) {
      const { data: srv, error: eS } = await sb.from('equipamentos').select('id,descricao,placa,numero_serie,ativo,fornecedores(razao_social)');
      if (eS) throw eS;
      dup = achar(srv||[]); if (dup) { erro.textContent = msgDup(dup); return; }
    }
    const { data, error } = await sb.from('equipamentos').update(campos).eq('id', id).select('id');
    if (error) throw error;
    if (!data || !data.length) { erro.textContent = 'Não foi possível salvar (sem permissão no servidor).'; return; }
    const i = (Repo.cat?.equipamentos||[]).findIndex(x=>x.id===id);
    if (i>=0) { Object.assign(Repo.cat.equipamentos[i], campos); await BD.gravar('meta', Repo.cat, 'catalogo'); }
    toast('Equipamento atualizado.', 'sucesso'); abrirFichaEquip(id); renderHome();
  } catch (x) { erro.textContent = traduzErro(x); }
  finally { const b = document.getElementById('ee-btn'); if (b) { b.disabled = false; b.textContent = 'Salvar'; } }
}

   VISTORIA — passo a passo

let vist = null, passoAtual = 0, secAberta = '1';
function novaVistoria(){
  vist = { id: uuid(), tipo: 'mobilizacao', status: 'rascunho', criado_em: new Date().toISOString(), data_vistoria: null,
    equipamento_id: null, equipamento: null, equip_novo: false, vistoria_mob_id: null, obra_id: null, obra_nome: '',
    local: '', latitude: null, longitude: null, resp: {}, observacoes: '', vistoriador_id: sessao.id, vistoriador_nome: sessao.nome,
    assin_vist: null, rep: { nome:'', documento:'', funcao:'', empresa:'', recusou:false, motivo:'', assin:null }, _passo: 0, _passoMax: 0 };
  passoAtual = 0; secAberta = '1';
  mostrarTela('tela-vist'); renderVist();
  pegarGPS(true);
}
function abrirVistoria(id){
  const v = Repo.vistoria(id);
  if (v && v.status!=='concluida') {
    vist = JSON.parse(JSON.stringify(v)); passoAtual = Math.min(v._passo||0, 4); secAberta = v._sec || '1';
    mostrarTela('tela-vist'); renderVist(); return;
  }
  abrirRelatorio(id);
}
let _autoT;
function autosalvar(imediato){
  if (!vist || !vist.equipamento_id) return;
  vist._passo = passoAtual; vist._passoMax = Math.max(vist._passoMax||0, passoAtual); vist._sec = secAberta;
  clearTimeout(_autoT);
  const f = ()=>Repo.salvar(JSON.parse(JSON.stringify(vist)), false).catch(e=>toast('Não foi possível guardar no celular: '+e.message, 'erro'));
  if (imediato) f(); else _autoT = setTimeout(f, 400);
}
// garante que o que foi digitado fica guardado se o app for fechado ou trocado
window.addEventListener('pagehide', ()=>{ if (vist) autosalvar(true); });
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && vist) autosalvar(true); });
function irPasso(n){ passoAtual = n; autosalvar(true); renderVist(); window.scrollTo(0,0); }
function voltarPasso(){ if (passoAtual>0) irPasso(passoAtual-1); else sairDaVistoria(); }
function sairDaVistoria(){ autosalvar(true); vist = null; mostrarTela('tela-home'); renderHome(); }
function abrirMenuVist(){
  const ops = [{ ic:'👁️', rotulo:'Ver prévia do relatório', valor:'previa' }, { ic:'🏠', rotulo:'Voltar à lista (fica salva no celular)', valor:'home' }];
  if (Repo.vistoria(vist.id) || vist.equipamento_id) ops.push({ ic:'🗑️', rotulo:'Excluir esta vistoria', sub:'Apaga as fotos tiradas nela', valor:'excluir', perigo:true });
  escolherOpcao('Vistoria', ops, async op=>{
    if (op==='previa') { autosalvar(true); await abrirRelatorio(vist.id, vist); }
    if (op==='home') sairDaVistoria();
    if (op==='excluir' && confirm('Excluir esta vistoria e todas as fotos dela? Não dá pra desfazer.')) { await Repo.apagar(vist.id); vist = null; mostrarTela('tela-home'); renderHome(); toast('Vistoria excluída'); }
  });
}
function renderVist(){
  const des = vist.tipo==='desmobilizacao';
  document.getElementById('vist-titulo').textContent = (des ? 'Desmobilização' : 'Mobilização') + (vist.equipamento ? ' · ' + (vist.equipamento.prefixo || vist.equipamento.placa || '') : '');
  document.getElementById('vist-sub').textContent = vist.equipamento?.descricao || 'Escolha o equipamento';
  const max = Math.max(vist._passoMax||0, passoAtual);
  document.getElementById('passos-vist').innerHTML = PASSOS.map((p,i)=>`<button class="passo ${i<passoAtual?'feito':''} ${i===passoAtual?'atual':''} ${i<=max && i!==passoAtual && vist.equipamento_id?'clicavel':''}" ${i<=max && i!==passoAtual && vist.equipamento_id?`onclick="irPasso(${i})"`:'disabled'}><span class="bola">${i<passoAtual?'✓':i+1}</span>${p}</button>`).join('');
  const corpo = document.getElementById('vist-corpo');
  corpo.innerHTML = [passoEquip, passoDados, passoChecklist, passoRevisao, passoAssinar][passoAtual]();
  if (passoAtual===2) hidratarFotos(corpo);
  if (passoAtual===4) ligarPads();
}

let buscaEquip = '', buscaForn = '';
const _semAc = s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const fmtDoc = d=>{ d = String(d||'').replace(/\D/g,''); return d.length===14 ? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5') : d.length===11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4') : d; };
// fornecedor escolhido na vistoria (rascunhos antigos: vem do equipamento)
function fornDaVist(){ return vist.fornecedor_id !== undefined ? vist.fornecedor_id : (vist.equipamento?.fornecedor_id || null); }

    <div class="passo-titulo" style="font-size:16px;margin-top:6px">1. Fornecedor</div>
    ${fid ? `<div class="resumo-equip"><div class="equip-ic">🏢</div><div style="flex:1;min-width:0"><div class="card-titulo">${esc(f?.razao_social || vist.equipamento?.fornecedor_nome || '—')}</div>
        <div class="card-sub">${esc([fmtDoc(f?.cpf_cnpj), nEq + (nEq===1?' equipamento':' equipamentos')].filter(Boolean).join(' · '))}${f?._novo && !f.enviado ? ' · <span class="selo selo-rascunho" style="padding:2px 7px">cadastrado no app</span>' : ''}</div></div>
        <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:flex-end">${Forn.podeEditar(f) ? `<button class="link-acao" onclick="abrirCadastroForn('${fid}')">Editar</button>` : ''}<button class="link-acao" onclick="trocarForn()">Trocar</button></div></div>`
    : `${vist.equipamento_id ? `<div class="ajuda alerta" style="margin:0 2px 10px">O equipamento "${esc(vist.equipamento.descricao)}" foi escolhido sem fornecedor. Escolha o fornecedor dele.</div>` : ''}
      <label class="busca" style="margin-bottom:10px"><svg class="ic" style="width:19px;height:19px"><use href="#i-busca"/></svg>
        <input type="search" id="busca-forn" value="${esc(buscaForn)}" placeholder="Nome, CNPJ ou CPF" oninput="buscaForn=this.value;atualizarListaForn()"/></label>
      <div id="lista-forn">${listaFornHtml()}</div>
      <button class="btn btn-secundario" style="margin-top:6px" onclick="abrirCadastroForn()">+ Cadastrar fornecedor que não está na lista</button>`}
    ${fid ? `<div class="passo-titulo" style="font-size:16px;margin-top:18px">2. Equipamento</div>
      ${vist.equipamento_id ? `<div style="margin-top:8px">${infoMob()}</div>` : ''}
      ${nEq > 6 ? `<label class="busca" style="margin-bottom:10px"><svg class="ic" style="width:19px;height:19px"><use href="#i-busca"/></svg>
        <input type="search" id="busca-equip" value="${esc(buscaEquip)}" placeholder="Prefixo, placa ou descrição" oninput="buscaEquip=this.value;atualizarListaEquip()"/></label>` : ''}
      <div id="lista-equip">${listaEquipHtml()}</div>
      <button class="btn btn-secundario" style="margin-top:6px" onclick="abrirCadastroEquip()">+ Cadastrar equipamento deste fornecedor</button>` : ''}
    <div class="barra-acao"><button class="btn" ${vist.equipamento_id && fid ?'':'disabled'} onclick="irPasso(1)">Continuar</button></div>`;

function listaFornHtml(){
  const q = _semAc(buscaForn).trim(), qd = buscaForn.replace(/\D/g,'');
  const cont = {}; Repo.equipamentos().forEach(e=>{ if (e.fornecedor_id) cont[e.fornecedor_id] = (cont[e.fornecedor_id]||0)+1; });
  let lista = Repo.fornecedores().filter(f=> q
    ? _semAc(f.razao_social).includes(q) || (qd.length>=3 && String(f.cpf_cnpj||'').replace(/\D/g,'').includes(qd))
    : (cont[f.id] || (f._novo && !f.enviado)));
  lista.sort((a,b)=>(cont[b.id]||0)-(cont[a.id]||0) || String(a.razao_social).localeCompare(String(b.razao_social),'pt-BR'));
  const total = lista.length; lista = lista.slice(0, 40);
  if (!total) return `<div class="vazio" style="padding:20px">${q ? 'Nenhum fornecedor encontrado.<br/>Se ele ainda não está no SIGECON, cadastre abaixo.' : 'Nenhum fornecedor com equipamento ainda.<br/>Digite acima pra buscar todos.'}</div>`;
  return (q ? '' : `<div class="ajuda" style="margin:0 2px 8px">Fornecedores com equipamento. Digite pra buscar todos.</div>`) + lista.map(f=>{
    const n = cont[f.id]||0;
    return `<button class="card" style="padding:11px 12px" onclick="escolherForn('${f.id}')">
      <div class="card-linha"><div class="equip-ic">🏢</div><div style="flex:1;min-width:0">
        <div class="card-titulo" style="font-size:14.5px">${esc(f.razao_social||'—')}</div>
        <div class="card-sub">${esc([fmtDoc(f.cpf_cnpj), n ? n+(n===1?' equipamento':' equipamentos') : 'nenhum equipamento ainda'].filter(Boolean).join(' · '))}${f._novo && !f.enviado ? ' <span class="selo selo-rascunho" style="padding:2px 7px">cadastrado no app</span>' : ''}</div>
      </div></div></button>`;
  }).join('') + (total>40 ? `<div class="ajuda" style="text-align:center;margin:6px 0 12px">Mostrando 40 de ${total}. Digite pra refinar a busca.</div>` : '');
}
function atualizarListaForn(){ const el = document.getElementById('lista-forn'); if (el) el.innerHTML = listaFornHtml(); }
function escolherForn(id){
  const f = Repo.fornecedor(id); if (!f) return;
  const antigo = vist.equipamento?.fornecedor_nome || '';
  vist.fornecedor_id = id;
  if (vist.equipamento_id && vist.equipamento?.fornecedor_id !== id) {
    if (vist.equipamento?.fornecedor_id) { vist.equipamento_id = null; vist.equipamento = {}; vist.equip_novo = false; vist.vistoria_mob_id = null; }
    else { // rascunho antigo, equipamento sem fornecedor: só completa
      vist.equipamento.fornecedor_id = id; vist.equipamento.fornecedor_nome = f.razao_social;
      const en = Repo.equipsNovos.find(x=>x.id===vist.equipamento_id);
      if (en && !en.fornecedor_id) { en.fornecedor_id = id; en.fornecedor_nome = f.razao_social; en.fornecedores = { razao_social:f.razao_social }; en.nao_cadastrado = null; Repo.salvarEquipNovo(en); }
    }
  }
  if (!vist.rep.empresa || vist.rep.empresa===antigo) vist.rep.empresa = f.razao_social;
  buscaEquip = ''; buscaForn = '';
  autosalvar(true); renderVist();
  // só um equipamento desse fornecedor: já deixa escolhido
  const eqs = Repo.equipamentos().filter(e=>e.fornecedor_id===id);
  if (!vist.equipamento_id && eqs.length===1) escolherEquip(eqs[0].id);
}
function trocarForn(){
  if (vist.equipamento_id && !confirm('Trocar o fornecedor? O equipamento escolhido será desmarcado.')) return;
  const fa = Repo.fornecedor(fornDaVist());
  if (vist.rep && fa && vist.rep.empresa===fa.razao_social) vist.rep.empresa = '';
  vist.fornecedor_id = null; vist.equipamento_id = null; vist.equipamento = {}; vist.equip_novo = false; vist.vistoria_mob_id = null;
  buscaForn = ''; buscaEquip = '';
  autosalvar(true); renderVist();
}
function infoMob(){
  if (vist.tipo!=='desmobilizacao') return '';
  const m = vist.vistoria_mob_id ? (Repo.vistoria(vist.vistoria_mob_id) || Repo.servidor.find(s=>s.id===vist.vistoria_mob_id)) : null;
  return m ? `<div class="ajuda" style="margin:-8px 2px 14px;color:var(--ok-txt)">✓ Vai comparar com a mobilização de ${fmtDataHora(m.data_vistoria)}.</div>`

}
function mudarTipo(t){ vist.tipo = t; if (vist.equipamento_id) vincularMob(); autosalvar(); renderVist(); }
function vincularMob(){ const m = vist.tipo==='desmobilizacao' ? Repo.ultimaMobilizacao(vist.equipamento_id) : null; vist.vistoria_mob_id = m ? m.id : null; }
function listaEquipHtml(){

        <div class="card-sub" style="font-size:12px">${obra?'🏗️ '+esc(obra.nome):''}${e._novo?' <span class="selo selo-rascunho" style="padding:2px 7px">cadastrado no app</span>':''}${temMob?' <span class="selo selo-desmob" style="padding:2px 7px">tem mobilização</span>':''}</div>

function atualizarListaEquip(){ const el = document.getElementById('lista-equip'); if (el) el.innerHTML = listaEquipHtml(); }
function snapshotEquip(e){
  return { descricao:e.descricao||'', prefixo:e.prefixo||'', placa:e.placa||'', numero_serie:e.numero_serie||'', marca:e.marca||'', modelo:e.modelo||'', ano:e.ano||'',
    tipo_nome: e.frota_tipos?.nome || '', categoria: e.frota_tipos?.categoria || e.tipo || '', fornecedor_id: e.fornecedor_id || null,
    fornecedor_nome: e.fornecedores?.razao_social || e.fornecedor_nome || '', foto_url: e.frota_tipos?.foto_url || null, novo: !!e._novo };
}
function escolherEquip(id){
  const e = Repo.equipamento(id); if (!e) return;
  vist.equipamento_id = id; vist.equipamento = snapshotEquip(e); vist.equip_novo = !!e._novo;
  if (e.fornecedor_id) vist.fornecedor_id = e.fornecedor_id;
  if (!vist.obra_id) { const o = Repo.obra(Repo.cat?.mob?.[id]) || Repo.obra(Prefs.get().obra); if (o) { vist.obra_id = o.id; vist.obra_nome = o.nome; } }
  if (!vist.rep.empresa) vist.rep.empresa = vist.equipamento.fornecedor_nome || '';
  vincularMob(); autosalvar(true); renderVist();
}

        <button type="button" class="doc-btn ${st}" onclick="document.getElementById('doc-in-${t.id}').click()">${st==='sistema'||st==='pendente' ? rot+' · trocar' : rot}</button>
        <input type="file" id="doc-in-${t.id}" accept="image/*,.pdf" hidden onchange="anexarDocForn(this,'${t.id}')"/></div>`;

async function anexarDocForn(input, tipoId){
  const arq = input.files && input.files[0]; input.value = ''; if (!arq) return;
  try {
    let blob = arq, mime = arq.type || 'application/octet-stream', nome = arq.name || 'documento';
    if (mime.startsWith('image/')) { blob = await dataUrlParaBlob(await reduzirFoto(arq, 1600)); mime = 'image/jpeg'; nome = nome.replace(/\.[^.]+$/, '') + '.jpg'; }
    if (blob.size > 15*1024*1024) { toast('Arquivo muito grande (máx. 15 MB).', 'erro'); return; }
    _nfDocs[tipoId] = { blob, mime, nome, bytes: blob.size };
    renderDocsForn();
  } catch (e) { toast('Não deu pra usar esse arquivo: ' + (e.message||e), 'erro'); }
}

// mesma validação do app de imóveis (dígitos verificadores)
function validarDoc(valor, tipo){
  const d = String(valor||'').replace(/\D/g,'');
  if (!d) return { ok:false, msg:'Informe o '+(tipo==='PF'?'CPF':'CNPJ')+' — é obrigatório pra evitar cadastro duplicado.' };
  if (tipo==='PF' && d.length!==11) return { ok:false, msg:'CPF precisa ter 11 números.' };
  if (tipo==='PJ' && d.length!==14) return { ok:false, msg:'CNPJ precisa ter 14 números.' };
  if (/^(\d)\1+$/.test(d)) return { ok:false, msg:(d.length===11?'CPF':'CNPJ')+' inválido.' };
  if (d.length===11) {
    const dv = n=>{ let s=0; for (let i=0;i<n;i++) s += +d[i]*(n+1-i); const r=(s*10)%11; return r===10?0:r; };
    if (dv(9)!==+d[9] || dv(10)!==+d[10]) return { ok:false, msg:'CPF inválido — confira os números.' };
  } else {
    const dv = n=>{ const p = n===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2]; let s=0; for (let i=0;i<n;i++) s += +d[i]*p[i]; const r=s%11; return r<2?0:11-r; };
    if (dv(12)!==+d[12] || dv(13)!==+d[13]) return { ok:false, msg:'CNPJ inválido — confira os números.' };
  }
  return { ok:true, digitos:d };
}
// já existe fornecedor com esse CPF/CNPJ (no celular ou no sistema)? ignora o próprio na edição
async function fornPorDoc(d, ignorarId){
  const local = Repo.fornecedores().find(f=>f.id!==ignorarId && String(f.cpf_cnpj||'').replace(/\D/g,'')===d);
  if (local) return local;
  if (!navigator.onLine) return null;
  try { return await buscarFornPorDoc(d, ignorarId||null); } catch(e){ return null; }
}
async function ceChecarDoc(){
  const el = document.getElementById('nf-aviso'); if (!el) return;
  el.textContent = ''; _ceDupForn = null;
  const v = validarDoc(document.getElementById('nf-doc').value, _ceTipoPessoa);
  if (!v.ok) return;
  const dup = await fornPorDoc(v.digitos, _nfEditId);
  if (dup) { _ceDupForn = dup; el.innerHTML = `⚠️ Já cadastrado: <b>${esc(dup.razao_social||'')}</b>${dup.ativo===false?' (inativo)':''}`; }
}
async function _guardarDocsForn(fid){
  const ids = new Set(Forn.categorias(_ceTipoPessoa).flatMap(c=>c.tipos.map(t=>t.id)));
  for (const [tipoId, d] of Object.entries(_nfDocs)) {
    if (!ids.has(tipoId)) continue; // documento que não vale pro tipo de pessoa escolhido
    const aid = uuid();
    await BD.gravar('fotos', { id: aid, tipo: 'doc_forn', blob: d.blob, mime: d.mime, nome: d.nome, bytes: d.bytes, em: new Date().toISOString() });
    await Forn.add({ tipo: 'doc', fornecedor_id: fid, documento_tipo_id: tipoId, arquivo_id: aid });
  }
}
async function salvarCadastroForn(){
  const g = id=>(document.getElementById(id)?.value||'').trim(), erro = document.getElementById('nf-erro');
  erro.textContent = '';
  const nome = g('nf-nome'), vd = validarDoc(g('nf-doc'), _ceTipoPessoa);
  if (!vd.ok) { erro.textContent = vd.msg; return; }
  if (!nome) { erro.textContent = 'Informe '+(_ceTipoPessoa==='PF'?'o nome':'a razão social')+' do fornecedor.'; return; }
  const dup = await fornPorDoc(vd.digitos, _nfEditId);
  const rot = vd.digitos.length===11 ? 'CPF' : 'CNPJ';
  if (dup && (_nfEditId || dup.ativo===false)) {
    erro.textContent = `Esse ${rot} já é do fornecedor "${dup.razao_social||''}"${dup.ativo===false?' (inativo — peça pro escritório reativar)':''}.`; return;
  }
  if (dup) {
    if (!confirm(`Já existe um fornecedor com esse ${rot}:\n\n${dup.razao_social||'(sem nome)'}\n\nUsar esse cadastro?`)) { erro.textContent = `Não dá pra cadastrar: o ${rot} já pertence a "${dup.razao_social||''}".`; return; }
    if (!Repo.fornecedor(dup.id) && Repo.cat) { Repo.cat.fornecedores = [...(Repo.cat.fornecedores||[]), { id:dup.id, razao_social:dup.razao_social, cpf_cnpj:dup.cpf_cnpj }]; await BD.gravar('meta', Repo.cat, 'catalogo'); }
    fecharModal(); escolherForn(dup.id);
    toast('Fornecedor existente escolhido.', 'sucesso');
    return;
  }
  const campos = { tipo_pessoa: _ceTipoPessoa, razao_social: nome, cpf_cnpj: vd.digitos, telefone: g('nf-tel') || null, email: g('nf-email') || null };

  if (_nfEditId) {
    const f = Repo.fornecedor(_nfEditId);
    const nomeAntigo = f.razao_social;
    if (f._novo && !f.enviado) { Object.assign(f, campos); await Repo.salvarFornNovo(f); } // ainda não subiu: o cadastro sobe já corrigido
    else {
      if (f._novo) { Object.assign(f, campos); await Repo.salvarFornNovo(f); }
      const i = (Repo.cat.fornecedores||[]).findIndex(x=>x.id===f.id); if (i>=0) { Object.assign(Repo.cat.fornecedores[i], campos); await BD.gravar('meta', Repo.cat, 'catalogo'); }
      await Forn.add({ tipo: 'atualizar', fornecedor_id: f.id, campos });
    }
    if (f._novo && !f.enviado) { // categorias só no cadastro (PF/PJ pode ter mudado)
      Forn.pend = Forn.pend.filter(p=>!(p.tipo==='vinculo' && p.fornecedor_id===f.id));
      for (const c of Forn.categorias(_ceTipoPessoa)) Forn.pend.push({ id:uuid(), em:new Date().toISOString(), tipo:'vinculo', fornecedor_id:f.id, categoria_id:c.id });
      await Forn._gravar();
    }
    await _guardarDocsForn(f.id);
    await trocarFornecedor(f.id, f.id, nome); // atualiza o nome nas vistorias e equipamentos do celular
    if (vist && vist.equipamento?.fornecedor_id===f.id) vist.equipamento.fornecedor_nome = nome;
    if (vist && vist.rep && vist.rep.empresa===nomeAntigo) vist.rep.empresa = nome;
    if (vist) autosalvar(true);
    fecharModal(); renderVist(); Sinc.rodar(true);
    toast('Fornecedor atualizado.', 'sucesso');
    return;
  }

  const f = { id: uuid(), _novo: true, ...campos, criado_por: sessao?.id || null,
    rep_nome: _ceTipoPessoa==='PJ' ? g('nf-rep-nome') : '', rep_cpf: _ceTipoPessoa==='PJ' ? g('nf-rep-cpf').replace(/\D/g,'') : '', criado_em: new Date().toISOString() };
  await Repo.salvarFornNovo(f);
  for (const c of Forn.categorias(_ceTipoPessoa)) await Forn.add({ tipo:'vinculo', fornecedor_id:f.id, categoria_id:c.id });
  await _guardarDocsForn(f.id);
  fecharModal(); escolherForn(f.id);
  toast('Fornecedor cadastrado. Agora cadastre o equipamento.', 'sucesso');
}

function rotulosSit(i){
  const des = vist.tipo==='desmobilizacao';
  if (i.tipo==='avaria') return [['nao', des?'✅ Nada novo':'✅ Não há','ok'], ['sim', des?'⚠️ Nova':'⚠️ Há','avaria'], ...(i.opc?[['na','➖ N/A','na']]:[])];
  return [['ok', des?'✅ Sem alteração':'✅ Bom','ok'], ['avaria', des?'⚠️ Nova avaria':'⚠️ Avaria','avaria'], ...(i.opc?[['na','➖ N/A','na']]:[])];
}
function itemCompleto(i, r){
  r = r || vist.resp[i.c];
  if (!r || !r.sit) return false;
  if (r.sit==='na' || r.sit==='nao') return true;
  if (i.tipo==='medidor' && r.valor==null) return false;
  if (!(r.fotos||[]).length) return false;
  if ((r.sit==='avaria' || r.sit==='sim') && !(r.obs||'').trim()) return false;
  return true;
}
function faltaNoItem(i){
  const r = vist.resp[i.c];
  if (!r || !r.sit) return 'falta marcar a situação';
  if (r.sit==='na' || r.sit==='nao') return '';
  if (i.tipo==='medidor' && r.valor==null) return 'falta a leitura';
  if (!(r.fotos||[]).length) return 'falta a foto';
  if ((r.sit==='avaria' || r.sit==='sim') && !(r.obs||'').trim()) return 'descreva a avaria';
  return '';
}
function progresso(v){
  const vv = v || vist; const salvo = vist; vist = vv;
  const feitos = ITENS.filter(i=>itemCompleto(i)).length; vist = salvo;
  return { feitos, total: ITENS.length };
}
function classeItem(i){ const r = vist.resp[i.c]; if (!r || !r.sit) return ''; if (r.sit==='na') return 'st-na'; if (!itemCompleto(i)) return 'falta-foto'; return (r.sit==='avaria'||r.sit==='sim') ? 'st-avaria' : 'st-ok'; }
function passoChecklist(){
  const p = progresso();

    <div class="barra-acao"><button class="btn" onclick="irPasso(3)">Revisar</button></div>`;
}
function secaoHtml(s){
  const feitos = s.itens.filter(i=>itemCompleto(i)).length, av = s.itens.filter(i=>['avaria','sim'].includes(vist.resp[i.c]?.sit)).length;

const Camera = {
  _s: null, _op: null, _frente: false, _trk: null, _zoom: 1, _zMin: 1, _zMax: 4, _hw: false, _devId: null, _lentes: [], _zBusy: false, _zPend: null,
  async abrir(op){
    this._op = op; this._frente = !!op.frontal;
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { op.reserva && op.reserva(); return; }
    let el = document.getElementById('camera');
    if (!el) { el = document.createElement('div'); el.id = 'camera'; document.body.appendChild(el); }
    el.innerHTML = `<div class="cam-topo"><button class="cam-x" onclick="Camera.fechar()" aria-label="Fechar">✕</button><div class="cam-tit">${esc(op.titulo||'')}</div><span class="cam-n" id="cam-n"></span></div>
      <div class="cam-vid" id="cam-vid"><video id="cam-video" autoplay playsinline muted></video></div><div class="cam-flash" id="cam-flash"></div>
      <div class="cam-zoom" id="cam-zoom" hidden><div class="cam-chips" id="cam-chips"></div><input type="range" class="cam-zr" id="cam-zr" aria-label="Zoom"/></div>
      ${op.arquivo ? `<button class="cam-arq" onclick="Camera.daGaleria()">📁 Escolher dos arquivos</button>` : ''}
      <div class="cam-base"><button class="cam-lado" onclick="Camera.virar()" aria-label="Trocar câmera">🔄</button><button class="cam-lente" id="cam-lente" onclick="Camera.lente()" aria-label="Trocar lente" hidden></button>
        <button class="cam-disparo" id="cam-disparo" onclick="Camera.capturar()" aria-label="Tirar foto"></button>
        <button class="cam-lado cam-ok" onclick="Camera.fechar()">${op.multipla ? 'Pronto' : 'Cancelar'}</button></div>`;
    el.classList.add('aberta'); document.body.style.overflow = 'hidden';
    this._contador();
    if (!(await this._ligar())) { this.fechar(); op.reserva && op.reserva(); }
  },
  async _ligar(){

    const tam = { width:{ ideal:1920 }, height:{ ideal:1440 } };
    const tentativas = [];
    if (this._devId && !this._frente) tentativas.push({ video:{ deviceId:{ exact:this._devId }, ...tam }, audio:false });   // lente escolhida
    tentativas.push({ video:{ facingMode:{ exact:modo }, ...tam }, audio:false }, { video:{ facingMode:modo, ...tam }, audio:false });
    for (const t of tentativas) {
      try {
        this._s = await navigator.mediaDevices.getUserMedia(t);
        const v = document.getElementById('cam-video'); v.srcObject = this._s; v.classList.toggle('espelho', this._frente);
        await v.play().catch(()=>{});

    }

  },
  async virar(){ this._devId = null; this._frente = !this._frente; if (!(await this._ligar())) { this._frente = !this._frente; await this._ligar(); } },
  /* ── ZOOM ── Zoom óptico/do aparelho quando o navegador oferece (Android/Chrome); senão, zoom digital (recorte). */
  _prepararZoom(){

  async _zoomPara(z){

  _visual(){ const v = document.getElementById('cam-video'); if (!v) return; v.style.transform = (this._frente ? 'scaleX(-1) ' : '') + (this._hw ? '' : `scale(${this._zoom})`); },
  _marcarZoom(){

  async _listarLentes(){

    const rank = d => /ultra/i.test(d.label) ? 0 : /tele/i.test(d.label) ? 2 : 1;

    this._botaoLente();

  _botaoLente(){

    const i = Math.max(0, this._lentes.findIndex(l => l.id === (this._devId || atualId)));

  },
  async lente(){

    const i = Math.max(0, this._lentes.findIndex(l => l.id === (this._devId || atualId)));

  },
  _contador(){ const el = document.getElementById('cam-n'); if (el && this._op?.contar) el.textContent = `${this._op.contar()}/${this._op.limite} fotos`; },
  async capturar(){

    const zd = this._hw ? 1 : Math.max(1, this._zoom);   // zoom digital: recorta o centro (o zoom do aparelho já vem na imagem)
    const sw = v.videoWidth / zd, sh = v.videoHeight / zd, sx = (v.videoWidth - sw) / 2, sy = (v.videoHeight - sh) / 2;

  _parar(){ if (this._s) { this._s.getTracks().forEach(t=>t.stop()); this._s = null; } this._trk = null; },

async function fotoEscolhida(input){
  const c = window._fotoAlvo, arquivos = [...(input.files||[])]; input.value = '';
  if (!c || !arquivos.length || !vist) return;
  const i = ITEM[c], r = resp(c);
  const e = vist.equipamento || {};
  const leg1 = `${fmtDataHora(new Date().toISOString())} · ${[e.prefixo || e.placa, e.descricao].filter(Boolean).join(' · ')}`.slice(0, 110);
  const leg2 = `${vist.tipo==='desmobilizacao'?'Desmobilização':'Mobilização'} · ${c} ${i.t}${vist.latitude!=null?` · ${vist.latitude.toFixed(5)}, ${vist.longitude.toFixed(5)}`:''}`.slice(0, 120);
  let n = 0;
  for (const a of arquivos.slice(0, CONFIG.FOTOS_POR_ITEM - (r.fotos||[]).length)) {
    try {
      const blob = await prepararFoto(a, leg1, leg2);
      const id = uuid();
      await BD.gravar('fotos', { id, vistoria_id: vist.id, codigo: c, blob, bytes: blob.size, em: new Date().toISOString() });
      r.fotos = r.fotos || []; r.fotos.push(id); n++;
    } catch (err) { toast(err.message || 'Não foi possível usar essa foto.', 'erro'); }
  }
  if (n && !r.sit) r.sit = i.tipo==='avaria' ? 'sim' : 'ok';
  autosalvar(true); rerenderItem(c);
}
async function removerFoto(c, fid){
  if (!confirm('Apagar esta foto?')) return;
  const r = resp(c); r.fotos = (r.fotos||[]).filter(x=>x!==fid);
  await BD.apagar('fotos', fid).catch(()=>{});
  if (_urlFoto[fid]) { URL.revokeObjectURL(_urlFoto[fid]); delete _urlFoto[fid]; }

async function hidratarFotos(raiz){
  const els = [...raiz.querySelectorAll('[data-foto],[data-caminho]')];
  const caminhos = els.map(el=>el.dataset.caminho).filter(Boolean);
  const assinada = caminhos.length ? await urlsAssinadas(caminhos) : ()=>null;
  for (const el of els) {

  }
}

/* =====================================================================
   ASSINATURA SALVA + SELFIE — igual aos apps da frota e de imóveis.
   Usa a mesma tabela (frota_assinatura_salva): quem já cadastrou a
   assinatura num deles não precisa cadastrar de novo.
   ===================================================================== */
const MinhaAssinatura = {
  chave(){ return 'assinatura_'+sessao.id; },
  async obter(){ return await BD.pegar('meta', this.chave()); },
  async carregarDoSistema(){
    if (!online() || !sessao) return;
    const local = await this.obter();
    if (local && local.pendente) return this.enviar();
    const { data, error } = await sb.from('frota_assinatura_salva').select('imagem,consentimento_em,atualizado_em').eq('usuario_id', sessao.id).maybeSingle();
    if (!error && data && data.imagem) await BD.gravar('meta', data, this.chave());
  },
  async salvar(imagem){
    const agora = new Date().toISOString();
    const a = { imagem, consentimento_em: agora, atualizado_em: agora, pendente: true };
    await BD.gravar('meta', a, this.chave());
    this.enviar().catch(()=>{});
    return a;
  },
  async enviar(){
    const a = await this.obter(); if (!a || !a.pendente || !online()) return;
    const { error } = await sb.from('frota_assinatura_salva').upsert({ usuario_id:sessao.id, imagem:a.imagem, consentimento_em:a.consentimento_em, atualizado_em:a.atualizado_em });
    if (!error) { a.pendente = false; await BD.gravar('meta', a, this.chave()); }
  },
};
function abrirCadastroAssinatura(depois){
  abrirModal('Cadastre sua assinatura', `<div class="passo-desc">Você faz sua assinatura uma vez só. Depois, pra assinar cada vistoria, basta tirar uma selfie. É a mesma assinatura dos apps da frota e de imóveis.</div>
    <div class="pad-wrap"><canvas id="pad-cad" aria-label="Área de assinatura"></canvas><div class="pad-linha"></div><div class="pad-dica">Assine aqui com o dedo</div>
      <button class="pad-limpar" onclick="window._pad.limpar()">Limpar</button></div>
    <label class="consentimento"><input type="checkbox" id="cad-consent"/><span>Concordo que, ao assinar uma vistoria, o app use esta assinatura e registre uma foto minha (selfie), a data, a hora e a localização, para comprovar que fui eu quem assinou. A foto fica guardada de forma privada e só a equipe do sistema pode ver.</span></label>
    <div class="erro-msg" id="cad-erro" style="margin-top:10px"></div>

      toast('Assinatura salva', 'sucesso');
      if (depois) depois(); else fecharModal();

}
function reduzirFoto(arquivo, max){
  return new Promise((ok, falha)=>{
    const url = URL.createObjectURL(arquivo), im = new Image();
    im.onload = ()=>{
      const f = Math.min(1, (max||320)/Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*f); c.height = Math.round(im.height*f);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.65));
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); falha(new Error('Não foi possível ler a foto.')); };
    im.src = url;
  });
}
function pegarLocalizacao(){
  return new Promise(ok=>{
    if (!navigator.geolocation) return ok({ erro:'indisponível no aparelho' });
    navigator.geolocation.getCurrentPosition(
      p=>ok({ lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), precisao_m:Math.round(p.coords.accuracy) }),
      e=>ok({ erro: e.code===1 ? 'não autorizada' : 'não obtida' }),
      { enableHighAccuracy:true, timeout:12000, maximumAge:120000 });
  });
}

let _cam = null;
function pararCamera(){ if (_cam) { _cam.getTracks().forEach(t=>t.stop()); _cam = null; } }
function acaoSelfie(){ if (_cam) capturarSelfie(); else abrirCamera(); }
async function abrirCamera(){
  const erro = document.getElementById('pad-erro'), prev = document.getElementById('selfie-prev'), btn = document.getElementById('selfie-btn');
  erro.textContent = '';
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      _cam = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ ideal:640 }, height:{ ideal:640 } }, audio:false });
      prev.classList.add('ao-vivo');
      prev.innerHTML = '<video id="selfie-video" autoplay playsinline muted></video>';
      const v = document.getElementById('selfie-video'); v.srcObject = _cam; await v.play().catch(()=>{});
      btn.textContent = '📸 Capturar';
      return;
    } catch (e) {
      pararCamera();
      if (e && e.name==='NotAllowedError') { erro.textContent = 'A câmera foi bloqueada. Libere o acesso à câmera nas configurações do navegador e tente de novo.'; return; }
    }
  }
  if (matchMedia('(pointer: coarse)').matches) document.getElementById('selfie-arquivo').click();
  else erro.textContent = 'Não encontramos uma câmera neste aparelho. Use "Assinar desenhando".';
}
function capturarSelfie(){
  const v = document.getElementById('selfie-video'); if (!v || !v.videoWidth) return;
  const max = 320, f = Math.min(1, max/Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth*f); c.height = Math.round(v.videoHeight*f);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  window._selfie = c.toDataURL('image/jpeg', 0.6);
  pararCamera();
  const prev = document.getElementById('selfie-prev'); prev.classList.remove('ao-vivo');
  prev.innerHTML = `<img src="${window._selfie}" alt="Sua selfie"/>`;
  document.getElementById('selfie-btn').textContent = '📷 Tirar outra';
  document.getElementById('pad-erro').textContent = '';
}
async function receberSelfie(input){
  const arq = input.files && input.files[0]; if (!arq) return;
  try {
    window._selfie = await reduzirFoto(arq, 320);
    document.getElementById('selfie-prev').innerHTML = `<img src="${window._selfie}" alt="Sua selfie"/>`;
    document.getElementById('selfie-btn').textContent = '📷 Tirar outra';
    document.getElementById('pad-erro').textContent = '';
  } catch (e) { document.getElementById('pad-erro').textContent = e.message; }
  input.value = '';
}

async function relDeLocal(v){
  const itens = [];
  for (const i of ITENS) {
    const r = v.resp[i.c]; if (!r || !r.sit) continue;
    const fotos = []; for (const f of (r.fotos||[])) { const u = await urlFoto(f); if (u) fotos.push(u); }
    itens.push({ codigo:i.c, secao:i.secao, secao_titulo:i.secao_titulo, titulo:i.t, tipo:i.tipo, situacao:r.sit, obs:r.obs, valor:r.valor, unidade:i.un, texto:r.texto, fotos });
  }
  return { id:v.id, tipo:v.tipo, data_vistoria:v.data_vistoria, local:v.local, latitude:v.latitude, longitude:v.longitude, obra_nome:v.obra_nome, equipamento:v.equipamento||{},
    horimetro: v.horimetro ?? (v.resp['1.3']?.sit!=='na' ? v.resp['1.3']?.valor : null), hodometro: v.hodometro ?? (v.resp['1.4']?.sit!=='na' ? v.resp['1.4']?.valor : null),
    itens, observacoes:v.observacoes, vistoriador_nome:v.vistoriador_nome,
    vistoriador_assinatura: v.assin_vist?.img || await urlAssinada(v.assin_vist?.caminho), vistoriador_em: v.assin_vist?.em,
    vistoriador_selfie: v.assin_vist?.selfie || await urlAssinada(v.assin_vist?.selfie_caminho), vistoriador_metodo: v.assin_vist?.metodo, vistoriador_gps: v.assin_vist?.gps,
    representante_foto: v.rep?.foto || await urlAssinada(v.rep?.foto_caminho), representante_foto_recusou: v.rep?.foto_recusou,
    representante_nome:v.rep?.nome, representante_documento:v.rep?.documento, representante_funcao:v.rep?.funcao, representante_empresa:v.rep?.empresa,
    representante_assinatura: v.rep?.assin?.img || await urlAssinada(v.rep?.assin?.caminho), representante_em: v.rep?.assin?.em,
    representante_recusou: v.rep?.recusou, representante_motivo: v.rep?.motivo };
}
async function relDeServidor(s){
  const caminhos = []; (s.itens||[]).forEach(i=>(i.fotos||[]).forEach(c=>caminhos.push(c))); [s.vistoriador_assinatura, s.representante_assinatura, s.vistoriador_selfie, s.representante_foto].forEach(c=>c && caminhos.push(c));
  const u = await urlsAssinadas(caminhos);
  return Object.assign({}, s, { itens:(s.itens||[]).map(i=>Object.assign({}, i, { fotos:(i.fotos||[]).map(u).filter(Boolean) })), vistoriador_assinatura:u(s.vistoriador_assinatura), representante_assinatura:u(s.representante_assinatura),
    vistoriador_selfie:u(s.vistoriador_selfie), representante_foto:u(s.representante_foto) });
}
async function relatorioDe(id, rascunho){
  const local = rascunho || Repo.vistoria(id);
  if (local) return await relDeLocal(local);
  const s = Repo.servidor.find(x=>x.id===id);
  return s ? await relDeServidor(s) : null;
}
let _relId = null, _relDeVist = false;
async function abrirRelatorio(id, rascunho){
  _relDeVist = !!rascunho; _relId = id;
  mostrarTela('tela-relatorio');
  const folha = document.getElementById('rel-folha');
  folha.innerHTML = '<div style="padding:40px;text-align:center;color:#666"><span class="spinner"></span> Montando o relatório…</div>';
  try {
    const v = await relatorioDe(id, rascunho);
    if (!v) { folha.innerHTML = '<div style="padding:30px;color:#666">Vistoria não encontrada.</div>'; return; }
    const mobId = (rascunho || Repo.vistoria(id) || Repo.servidor.find(x=>x.id===id))?.vistoria_mob_id;
    const mob = v.tipo==='desmobilizacao' && mobId ? await relatorioDe(mobId).catch(()=>null) : null;
    const des = v.tipo==='desmobilizacao';
    document.getElementById('rel-titulo').textContent = des ? 'Relatório de desmobilização' : 'Relatório de mobilização';
    document.getElementById('rel-sub').textContent = v.equipamento?.descricao || '';
    const semFotoOffline = !online() && !Repo.vistoria(id);
    folha.innerHTML = (rascunho && rascunho.status!=='concluida' ? '<div style="background:#fff3d6;color:#7a5200;border-radius:6px;padding:8px 10px;margin-bottom:10px;font:600 12px Arial">Prévia — a vistoria ainda não foi concluída.</div>' : '')
      + (semFotoOffline ? '<div style="background:#fde2e2;color:#8a1f1f;border-radius:6px;padding:8px 10px;margin-bottom:10px;font:600 12px Arial">Sem internet: as fotos desta vistoria aparecem quando o sinal voltar.</div>' : '')
      + relatorioVistoriaHtml(v, mob);
    document.getElementById('rel-acoes').innerHTML = `<button class="btn btn-secundario" onclick="fecharRelatorio()">Voltar</button><button class="btn" onclick="imprimirRelatorio()">🖨️ Imprimir / PDF</button>`;
  } catch (e) { folha.innerHTML = `<div style="padding:30px;color:#a00">Não foi possível montar o relatório: ${esc(e.message||e)}</div>`; }
}
function imprimirRelatorio(){
  const html = document.getElementById('rel-folha').innerHTML;
  document.getElementById('impressao').innerHTML = html;
  const imgs = [...document.querySelectorAll('#impressao img')];
  Promise.all(imgs.map(im=>im.complete ? 1 : new Promise(ok=>{ im.onload = im.onerror = ok; setTimeout(ok, 4000); }))).then(()=>setTimeout(()=>window.print(), 80));
}
function fecharRelatorio(){
  if (_relDeVist && vist) { mostrarTela('tela-vist'); renderVist(); return; }
  mostrarTela('tela-home'); renderHome();
}

/* =====================================================================
   INSTALAR / ATUALIZAR
   ===================================================================== */
let promptInstalar = null, swEsperando = null, atualizandoApp = false;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); promptInstalar = e; if (telaAtiva()==='tela-home') renderHome(); });
window.addEventListener('appinstalled', ()=>{ promptInstalar = null; toast('App instalado', 'sucesso'); if (telaAtiva()==='tela-home') renderHome(); });
async function instalarApp(){
  if (!promptInstalar) { abrirModal('Instalar o app', `<div class="passo-desc"><b>Android (Chrome):</b> toque nos ⋮ do navegador e em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.<br/><br/><b>iPhone (Safari):</b> toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</div><button class="btn" onclick="fecharModal()">Entendi</button>`); return; }
  promptInstalar.prompt(); try { await promptInstalar.userChoice; } catch (e) {} promptInstalar = null; renderHome();
}
function atualizarApp(){ if (!swEsperando) return location.reload(); atualizandoApp = true; swEsperando.postMessage('pular'); }
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const vigiar = w=>w && w.addEventListener('statechange', ()=>{ if (w.state==='installed' && navigator.serviceWorker.controller) { swEsperando = w; if (telaAtiva()==='tela-home') renderHome(); } });
    if (reg.waiting && navigator.serviceWorker.controller) swEsperando = reg.waiting;
    if (reg.installing) vigiar(reg.installing);
    reg.addEventListener('updatefound', ()=>vigiar(reg.installing));
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if (!atualizandoApp) return; atualizandoApp = false; location.reload(); });
}

iniciar();
</script>
